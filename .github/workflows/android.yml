name: Android build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APK_BASE: ds-chat-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            poc/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor
        working-directory: poc
        run: |
          rm -rf www
          mkdir -p www
          cp -a ../app/dist/. www/
          npm ci
          npx cap sync android

      - name: Prepare signing
        id: signing
        working-directory: poc
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Signing secrets are missing; refusing to publish an unsigned release. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are missing; building a debug APK instead."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: poc/android
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            echo "APK_PATH=poc/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew --no-daemon assembleDebug
            echo "APK_PATH=poc/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp "$APK_PATH" "dist/${APK_BASE}.apk"
          (cd dist && shasum -a 256 "${APK_BASE}.apk" > "${APK_BASE}.apk.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASE }}
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
